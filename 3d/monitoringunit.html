<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AreaInspect monitoring unit – 3D model</title>
<style>
  html,body{margin:0;height:100%;background:#0e1116;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f3f4f6;overflow:hidden}
  #app{position:fixed;inset:0}
  #app canvas{display:block;touch-action:none}
  #labels{position:absolute;inset:0;pointer-events:none}
  .lbl{pointer-events:none}
  .embed #title,.embed #panel,.embed #film{display:none!important}
  .lbl span::before{content:'';position:absolute;left:50%;top:-14px;width:1px;height:12px;background:rgba(255,255,255,.75)}
  .lbl span{display:inline-block;position:relative;top:22px;font-size:11px;line-height:1.25;padding:3px 8px;border-radius:999px;background:rgba(15,18,24,.84);color:#fff;white-space:nowrap;border:1px solid rgba(255,255,255,.2)}
  #title{position:fixed;top:12px;left:12px;right:12px;font-size:13px;color:#1b2430;text-shadow:0 1px 0 rgba(255,255,255,.5);pointer-events:none}
  body.night #title{color:#dfe7f3;text-shadow:none}
  #title b{font-size:15px}
  #panel{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(640px,100%);box-sizing:border-box;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(14,17,22,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px 14px 0 0}
  #cap{font-size:12.5px;line-height:1.4;color:#d7dce3;margin:0 2px 9px;min-height:3.6em}
  .row{display:flex;gap:6px}
  .row+.row{margin-top:6px}
  button{flex:1;font:inherit;font-size:12.5px;padding:8px 4px;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#f3f4f6;cursor:pointer}
  button.on{background:#e8eef7;color:#10151c;border-color:#e8eef7;font-weight:600}
  #film{position:fixed;inset:0;background:rgba(8,10,14,.9);display:none;align-items:center;justify-content:center;z-index:20}
  .fin{width:min(92vw,440px);text-align:center}
  #filmCanvas,#filmImg,#filmVid{width:100%;aspect-ratio:1;border-radius:10px;background:#000;display:block}
  #filmImg,#filmVid{display:none}
  .fb{display:none;gap:8px;margin-top:6px}
  #filmMsg{margin:10px 0;font-size:13px;color:#d7dce3}
  #err{position:fixed;top:50px;left:12px;right:12px;font-size:12px;color:#ffd7c2;background:rgba(80,20,10,.85);padding:8px 10px;border-radius:8px;display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.min.js" async></script>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
<script>if (/[?&]embed=/.test(location.search)) document.documentElement.classList.add('embed');</script>
</head>
<body>
<div id="app"></div>
<div id="title"><b>AreaInspect</b> · mobile monitoring unit (concept)</div>
<div id="err"></div>
<div id="film"><div class="fin">
  <canvas id="filmCanvas"></canvas><img id="filmImg" alt="AreaInspect film"><video id="filmVid" controls playsinline loop muted></video>
  <div id="filmMsg">Starting…</div>
  <div id="filmScen" class="fb"><button id="scenWind" class="on">Wind turbine</button><button id="scenBuild">Building</button></div>
  <div id="filmChoose" class="fb"><button id="filmMp4" class="on">MP4 (HD 720p)</button><button id="filmGif">GIF</button><button id="filmCancel">Cancel</button></div>
  <div id="filmBtns" class="fb"><button id="filmSave" class="on">Download</button><button id="filmAgain">New film</button><button id="filmClose">Close</button></div>
</div></div>
<div id="panel">
  <div id="cap"></div>
  <div class="row" id="modes">
    <button data-m="unit">Unit</button>
    <button data-m="top">Camera head</button>
    <button data-m="wind">Wind turbine</button>
    <button data-m="gebouw">Building corner</button>
  </div>
  <div class="row">
    <button id="tLbl" class="on">Labels</button>
    <button id="tNight">Night</button>
    <button id="tRot">Rotate</button>
    <button id="tFilm">Film</button>
    <button id="tRenders">Renders</button>
  </div>
</div>

<script>
  window.addEventListener('error', e => { const el=document.getElementById('err'); el.style.display='block'; el.textContent='Error: '+(e.message||e); });
  setTimeout(() => { if(!window.__ok){ const el=document.getElementById('err'); el.style.display='block'; el.textContent='The 3D model did not load. Check your internet connection and reload the page.'; } }, 12000);
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const V = (x,y,z) => new THREE.Vector3(x,y,z);
const app = document.getElementById('app');

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
app.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.id = 'labels';
app.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1200);
camera.position.set(6.5, 3.6, 8.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 1.2;
controls.maxDistance = 90;
controls.target.set(0, 2.9, 0);
controls.autoRotateSpeed = 0.8;

// sky
const skyU = { top:{ value:new THREE.Color(0x6fa3d6) }, bot:{ value:new THREE.Color(0xe4ecf0) } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(450, 32, 16), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, toneMapped: false,
  vertexShader: `
    varying vec3 vW;
    void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `
    uniform vec3 top; uniform vec3 bot; varying vec3 vW;
    void main(){
      float h = clamp(normalize(vW).y * 2.2, 0.0, 1.0);
      gl_FragColor = vec4(mix(bot, top, pow(h, 0.7)), 1.0);
      #include <colorspace_fragment>
    }`
}));
sky.renderOrder = -1; sky.frustumCulled = false;
scene.add(sky);
scene.fog = new THREE.Fog(0xe4ecf0, 70, 260);

// lights
const hemi = new THREE.HemisphereLight(0xdfeaf5, 0x55603f, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.target.position.set(0, 0, -10);
sun.position.set(14, 30, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-30, right:30, top:30, bottom:-30, near:1, far:120 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

// ---------- textures ----------
function canvasTex(w, h, draw, repeat){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
const grassTex = canvasTex(256, 256, (g,w,h) => {
  g.fillStyle = '#6f8b4b'; g.fillRect(0,0,w,h);
  for (let i=0;i<5000;i++){
    const v = Math.random();
    g.fillStyle = v<.33 ? '#5f7b3f' : v<.66 ? '#7f9a58' : '#87a05c';
    g.fillRect(Math.random()*w, Math.random()*h, 2, 2);
  }
}, [300,300]);
function brickTex(rx, ry){
  return canvasTex(256, 256, (g,w,h) => {
    g.fillStyle = '#c4b9ab'; g.fillRect(0,0,w,h);
    const rows = 16, cols = 4, bh = h/rows, bw = w/cols;
    for (let r=0;r<rows;r++){
      const off = (r%2) ? bw/2 : 0;
      for (let c=-1;c<=cols;c++){
        const shade = 120 + Math.floor(Math.random()*30);
        g.fillStyle = `rgb(${shade+20},${Math.floor(shade*0.48)},${Math.floor(shade*0.34)})`;
        g.fillRect(c*bw+off+2, r*bh+1.5, bw-4, bh-3);
      }
    }
  }, [rx, ry]);
}
const roofTex = canvasTex(128, 128, (g,w,h) => {
  g.fillStyle = '#2f3134'; g.fillRect(0,0,w,h);
  for (let r=0;r<4;r++){ g.fillStyle = '#3c3e42'; g.fillRect(0, r*h/4, w, h/4-4); g.fillStyle='#26282b'; g.fillRect(0, r*h/4+h/4-4, w, 4); }
}, [15, 6]);
function signTex(draw){ return canvasTex(512, 160, draw); }
const brandTex = signTex((g,w,h) => {
  g.fillStyle = '#2b3036'; g.fillRect(0,0,w,h);
  g.fillStyle = '#9ccf6a'; g.fillRect(0,0,16,h);
  g.fillStyle = '#ffffff'; g.font = 'bold 64px sans-serif'; g.fillText('JT-ECOLOGIE', 40, 78);
  g.fillStyle = '#c9d1da'; g.font = '34px sans-serif'; g.fillText('ecologische monitoring', 40, 128);
});
const warnTex = signTex((g,w,h) => {
  g.fillStyle = '#f2c200'; g.fillRect(0,0,w,h);
  g.fillStyle = '#111'; g.font = 'bold 52px sans-serif'; g.fillText('CAMERABEWAKING', 30, 72);
  g.font = '32px sans-serif'; g.fillText('onderzoeksapparatuur · GPS', 30, 124);
});

const hazardTex = canvasTex(256, 64, (g,w,h) => {
  g.fillStyle = '#f5c000'; g.fillRect(0,0,w,h);
  g.fillStyle = '#111214';
  for (let x=-h; x<w+h; x+=48){ g.beginPath(); g.moveTo(x,0); g.lineTo(x+24,0); g.lineTo(x+24-h,h); g.lineTo(x-h,h); g.closePath(); g.fill(); }
}, [6,1]);
const logoTex = canvasTex(2048, 520, (g,w,h) => {
  g.fillStyle = '#111111';
  const r = 72; g.beginPath(); g.moveTo(r,0); g.arcTo(w,0,w,h,r); g.arcTo(w,h,0,h,r); g.arcTo(0,h,0,0,r); g.arcTo(0,0,w,0,r); g.closePath(); g.fill();
});
const logoTexP = canvasTex(2048, 520, (g,w,h) => { g.fillStyle = '#111111'; g.fillRect(0,0,w,h); });
{
  const img = new Image();
  globalThis.__logoImg = img;
  img.onload = () => {
    const c = logoTex.image, g = c.getContext('2d');
    const pad = 60, sw = c.width - 2*pad, sh = sw * img.height / img.width;
    g.drawImage(img, pad, (c.height - sh)/2, sw, sh);
    logoTex.needsUpdate = true;
    const cp = logoTexP.image, gp = cp.getContext('2d');
    gp.drawImage(c, 0, 0);
    gp.lineWidth = 22; gp.strokeStyle = '#f5c000';
    const r2 = 60, i2 = 14, w2 = cp.width - 2*i2, h2 = cp.height - 2*i2;

// ---------- helpers ----------
const B = (w,h,d) => new THREE.BoxGeometry(w,h,d);
const C = (rt,rb,h,s=24) => new THREE.CylinderGeometry(rt,rb,h,s);
function mesh(geo, m, parent, x=0, y=0, z=0){
  const o = new THREE.Mesh(geo, m);
  o.position.set(x,y,z); o.castShadow = true; o.receiveShadow = true;
  (parent || scene).add(o); return o;
}
function beam(m, parent, x1,z1, x2,z2, y, t=.1){
  const dx = x2-x1, dz = z2-z1, L = Math.hypot(dx,dz);
  const o = mesh(B(L,t,t), m, parent, (x1+x2)/2, y, (z1+z2)/2);
  o.rotation.y = Math.atan2(-dz, dx); return o;
}
const labels = [];
function label(text, parent, pos, group){
  const d = document.createElement('div'); d.className = 'lbl';
  d.innerHTML = '<span>' + text + '</span>';
  const o = new CSS2DObject(d); o.position.copy(pos); parent.add(o);
  o.userData.group = group; labels.push(o); return o;
}

}

function onFace(obj, k, y, out = .006){
  // k: 0 front(+z), 1 right(+x), 2 back(-z), 3 left(-x)
  const yawK = [0, Math.PI/2, Math.PI, -Math.PI/2][k];
  const g = new THREE.Group(); g.rotation.y = yawK; unit.add(g);
  const d = hwAt(y) + out * Math.cos(slopeA);
  obj.position.set(0, y + out * Math.sin(slopeA), d);
  obj.rotation.x = -slopeA;
  g.add(obj); return obj;
}

function frustumGeo(hfov, vfov){
  const x = Math.tan(hfov/2), y = Math.tan(vfov/2);
  const p = [0,0,0,  -x,-y,-1,  x,-y,-1,  x,y,-1,  -x,y,-1];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  g.setIndex([0,1,2, 0,2,3, 0,3,4, 0,4,1, 1,3,2, 1,4,3]);
  g.computeVertexNormals();
  return g;
}
function frustumLines(hfov, vfov){
  const x = Math.tan(hfov/2), y = Math.tan(vfov/2);
  const c = [[-x,-y,-1],[x,-y,-1],[x,y,-1],[-x,y,-1]];
  const p = [];
  c.forEach(k => p.push(0,0,0, ...k));
  for (let i=0;i<4;i++) p.push(...c[i], ...c[(i+1)%4]);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  return g;
}

// ---------- loop ----------
const clock = new THREE.Clock();
const tmp = V(0,0,0), tmp2 = V(0,0,0);
const ease = x => x<.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
const lerp = (a,b,k) => a + (b-a)*k;
cur = JSON.parse(JSON.stringify(goal));
goMode('unit', true);
let filming = false;

function simulate(dt, t){
  const k = 1 - Math.exp(-dt*3.5);
  cur.H = lerp(cur.H, goal.H, k);
  cur.cone = lerp(cur.cone, goal.cone, k);
  for (let i=0;i<3;i++){
    cur.aims[i].yaw = lerp(cur.aims[i].yaw, goal.aims[i].yaw, k);
    cur.aims[i].pitch = lerp(cur.aims[i].pitch, goal.aims[i].pitch, k);
    cams[i].yaw.rotation.y = cur.aims[i].yaw;
    cams[i].tilt.rotation.x = cur.aims[i].pitch;
    cams[i].cone.scale.setScalar(cur.cone);
  }
  setMast(cur.H);
  rotor.rotation.z -= dt*3.2;
  if (bats[0].visible){
    bats.forEach((b,i) => {
      batPos(i, t, mode, tmp); batPos(i, t+.05, mode, tmp2);
      b.position.copy(tmp); b.lookAt(tmp2);
      const f = Math.sin(t*16 + i)*.75;
      b.userData.wl.rotation.z = f; b.userData.wr.rotation.z = -f;
    });
  }
}

function frame(){
  requestAnimationFrame(frame);
  if (filming) return;
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  simulate(dt, t);
  if (tw){
    tw.t += dt; const e = ease(Math.min(1, tw.t/tw.dur));
    camera.position.lerpVectors(tw.p0, tw.p1, e);
    controls.target.lerpVectors(tw.q0, tw.q1, e);
    if (tw.t >= tw.dur) tw = null;
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
frame();

// ---- GIF encoder (median-cut palette + LZW) ----
function medianCut(px, n){
  const cnt = px.length/3;
  let boxes = [Uint32Array.from({length: cnt}, (_, i) => i)];
  const range = (b) => { let mn=[255,255,255], mx=[0,0,0];
    for (const i of b) for (let c=0;c<3;c++){ const v = px[i*3+c]; if (v<mn[c]) mn[c]=v; if (v>mx[c]) mx[c]=v; }
    return [mx[0]-mn[0], mx[1]-mn[1], mx[2]-mn[2]]; };
  while (boxes.length < n){
    let bi = -1, best = -1, bc = 0;
    boxes.forEach((b, i) => { if (b.length < 2) return; const r = range(b); const c = r.indexOf(Math.max(...r)); const sc = r[c]*Math.sqrt(b.length); if (sc > best){ best = sc; bi = i; bc = c; } });
    if (bi < 0 || best <= 0) break;
    const b = Array.from(boxes[bi]).sort((x, y) => px[x*3+bc] - px[y*3+bc]);
    const mid = b.length >> 1;
    boxes.splice(bi, 1, Uint32Array.from(b.slice(0, mid)), Uint32Array.from(b.slice(mid)));
  }
  const pal = new Uint8Array(256*3);
  boxes.forEach((b, j) => { const s=[0,0,0]; for (const i of b) for (let c=0;c<3;c++) s[c]+=px[i*3+c]; for (let c=0;c<3;c++) pal[j*3+c] = Math.round(s[c]/b.length); });
  // fixed anchors for brand colours
  const fix = [[17,17,17],[255,255,255],[245,192,0],[0,0,0]];
  fix.forEach((f, i) => { const j = 255 - i; pal[j*3]=f[0]; pal[j*3+1]=f[1]; pal[j*3+2]=f[2]; });
  return pal;
}
function buildLUT(pal){
  const lut = new Uint8Array(32768);
  for (let r=0;r<32;r++) for (let g=0;g<32;g++) for (let b=0;b<32;b++){
    const R = r*8+4, G = g*8+4, B2 = b*8+4; let bi = 0, bd = 1e9;
    for (let j=0;j<256;j++){ const dr=R-pal[j*3], dg=G-pal[j*3+1], db=B2-pal[j*3+2]; const d=dr*dr*2+dg*dg*3+db*db; if (d<bd){bd=d;bi=j;} }
    lut[(r<<10)|(g<<5)|b] = bi;
  }
  return lut;
}
function lzwBlocks(idx){
  const minCode = 8, clear = 256, eoi = 257;
  let codeSize = 9, next = 258, table = new Map();
  const bytes = []; let cur = 0, bits = 0;
  const emit = (c) => { cur |= c << bits; bits += codeSize; while (bits >= 8){ bytes.push(cur & 255); cur >>>= 8; bits -= 8; } };
  emit(clear);
  let ib = idx[0];
  for (let i=1;i<idx.length;i++){
    const k = idx[i], key = (ib << 8) | k, c = table.get(key);
    if (c === undefined){
      emit(ib);
      if (next === 4096){ emit(clear); next = eoi + 1; codeSize = minCode + 1; table = new Map(); }
      else { if (next >= (1 << codeSize)) codeSize++; table.set(key, next++); }
      ib = k;
    } else ib = c;
  }
  emit(ib); emit(eoi);
  if (bits > 0) bytes.push(cur & 255);
  const out = new Uint8Array(bytes.length + Math.ceil(bytes.length/255) + 2);
  let o = 0; out[o++] = minCode;
  for (let p=0;p<bytes.length;p+=255){ const n = Math.min(255, bytes.length-p); out[o++] = n; for (let q=0;q<n;q++) out[o++] = bytes[p+q]; }
  out[o++] = 0;
  return out.subarray(0, o);
}

}

}

async function loadMuxer(){
  if (window.Mp4Muxer) return window.Mp4Muxer;

}
async function pickCodec(S, fps){
  if (!('VideoEncoder' in window)) return null;
  for (const codec of ['avc1.640028', 'avc1.4d401f', 'avc1.42001f']){
    const cfg = { codec, width:S, height:S, bitrate: 6_000_000, framerate: fps };
    try { const r = await VideoEncoder.isConfigSupported(cfg); if (r.supported) return cfg; } catch(e){}
  }
  return null;
}

async function makeFilm(kind){

  document.getElementById('filmChoose').style.display = 'none';
  document.getElementById('filmScen').style.display = 'none';
  filming = true; outBlob = null;
  const isMp4 = kind === 'mp4';
  const S = isMp4 ? 720 : 400, RS = isMp4 ? 1080 : 800, fps = isMp4 ? 30 : 10;
  const N = Math.round(FILM_DUR*fps), dt = 1/fps;

  const saved = { mode, night, showLabels, pos: camera.position.clone(), tgt: controls.target.clone(), cur: JSON.parse(JSON.stringify(cur)), goal: JSON.parse(JSON.stringify(goal)) };
  const tick = () => new Promise(r => setTimeout(r, 0));
  const reset = () => { cur = JSON.parse(JSON.stringify(saved.cur)); goal = JSON.parse(JSON.stringify(saved.goal)); mode = 'none'; };

      const cfg = await pickCodec(S, fps);
      if (!cfg) throw new Error('this browser cannot encode MP4 video. Try Chrome, or use the GIF.');
      const MM = await loadMuxer();
      const muxer = new MM.Muxer({ target: new MM.ArrayBufferTarget(), video: { codec: 'avc', width: S, height: S, frameRate: fps }, fastStart: 'in-memory' });
      let encErr = null;

      enc.configure(cfg);
      reset();
      for (let i=0;i<N;i++){
        if (encErr) throw encErr;
        shoot(i*dt, dt);
        const vf = new VideoFrame(filmCanvas, { timestamp: Math.round(i*1e6/fps), duration: Math.round(1e6/fps) });
        enc.encode(vf, { keyFrame: i % (fps*2) === 0 }); vf.close();

      outBlob = new Blob([muxer.target.buffer], { type: 'video/mp4' }); outName = 'AreaInspect-monitoring-unit-' + (filmScenario === 'building' ? 'building' : 'wind-turbine') + '.mp4';
      filmVid.src = URL.createObjectURL(outBlob); filmVid.style.display = 'block'; filmCanvas.style.display = 'none';

function APPLY_SHOT(sh){

// ================= Stills (renders saved to this model's assets) =================
async function makeRenders(){
  if (filming) return;
  const show = (m) => { filmMsg.textContent = m; };
  filmBox.style.display = 'flex';
  document.querySelectorAll('#film .fb').forEach(el => el.style.display = 'none');
  filmImg.style.display = 'none'; filmVid.style.display = 'none'; filmCanvas.style.display = 'block';
  let api = null;
  try { api = window.claude && window.claude.use ? await window.claude.use('assets') : null; } catch(e){ api = null; }
  if (!api){ show('Renders can only be saved by the owner of this model.'); filmBtns.style.display = 'flex'; document.getElementById('filmSave').style.display = 'none'; return; }
  filming = true;
  const saved = SAVE_STATE();
  const S = 1080;
  const still = document.createElement('canvas'); still.width = still.height = S;
  const sctx = still.getContext('2d');
  filmCanvas.width = filmCanvas.height = 400; const pctx = filmCanvas.getContext('2d');
  renderer.setPixelRatio(1); renderer.setSize(S*2, S*2, false);
  camera.aspect = 1; camera.updateProjectionMatrix();
  const sm = sun.shadow.mapSize.x; sun.shadow.mapSize.set(4096, 4096); if (sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map = null; }
  const out = [];
  try {
    for (const sh of SHOTS){
      show('Rendering ' + sh.name + '… (' + (out.length + 1) + '/' + SHOTS.length + ')');
      APPLY_SHOT(sh);
      camera.position.set(...sh.cam); camera.lookAt(...sh.tgt);
      if (sh.laser) buildLasers();
      renderer.render(scene, camera);
      sctx.drawImage(renderer.domElement, 0, 0, S, S);
      if (sh.labels && typeof drawOverlay === 'function') drawOverlay(sctx, 30, S);
      pctx.drawImage(still, 0, 0, 400, 400);
      const blob = await new Promise(r => still.toBlob(r, 'image/jpeg', .92));
      const res = await api.upload(blob, { type:'image/jpeg' });
      out.push({ name: sh.name, id: res.id });
      await new Promise(r => setTimeout(r, 30));
    }
    const man = new Blob([JSON.stringify({ model: MODEL_NAME, renders: out }, null, 1)], { type:'application/json' });
    await api.upload(man, { type:'application/json' });
    show('Done: ' + out.length + ' renders saved to this model. Tell Claude they are ready.');
  } catch (e){
    show('Could not save the renders: ' + ((e && (e.code || e.message)) || e));
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  sun.shadow.mapSize.set(sm, sm); if (sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map = null; }
  RESTORE_STATE(saved);
  filming = false;
  filmBtns.style.display = 'flex'; document.getElementById('filmSave').style.display = 'none';
}
document.getElementById('tRenders').addEventListener('click', makeRenders);
// ===== Embed mode (website): freeze the film at time t and explore that moment in 3D =====
const EMB = new URLSearchParams(location.search);
if (EMB.has('embed')){
  document.body.classList.add('embed');
  const pose = (t) => {
    filmScenario = EMB.get('embed') === 'building' ? 'building' : 'wind';
    camKeys = filmScenario === 'building' ? camKeysBuild : camKeysWind;
    t = Math.max(0, Math.min(FILM_DUR - .1, t || 0));
    mode = 'none'; filmEvents(t); cur = JSON.parse(JSON.stringify(goal)); simulate(0, 100 + t);
    // in 3D always show the scene this film is about (turbine or building) behind the unit
    const W = filmScenario === 'wind'; turbine.visible = W; building.visible = !W; if (W) bats.forEach(b => b.visible = true);
    const c = camAt(t); camera.position.set(...c.p); controls.target.set(...c.q); tw = null;
    controls.autoRotate = false; controls.update();
  };
  pose(parseFloat(EMB.get('t')));
  addEventListener('message', (e) => { if (e.data && e.data.type === 'pose') pose(+e.data.t); });
  // a short click (no drag) inside the 3D view asks the website to continue the film
  let pd = null;
  addEventListener('pointerdown', (e) => { pd = { x:e.clientX, y:e.clientY, t:performance.now() }; });
  addEventListener('pointerup', (e) => {
    if (pd && Math.hypot(e.clientX - pd.x, e.clientY - pd.y) < 6 && performance.now() - pd.t < 350 && parent !== window) parent.postMessage({ type:'areainspect-resume' }, '*');
    pd = null;
  });
}
